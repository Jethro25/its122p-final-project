    <linearGradient id="wood" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#B98F6C"/><stop offset="1" stop-color="#9A7458"/></linearGradient>
  </defs>
  <circle cx="300" cy="250" r="205" fill="#F1E3D0"/>
  <circle cx="455" cy="95" r="34" fill="#F6EADB"/>
  <circle cx="110" cy="390" r="22" fill="#EAD8C2"/>
  <!-- hanging lamp -->
  <line x1="300" y1="0" x2="300" y2="58" stroke="#7C5B44" stroke-width="3"/>
