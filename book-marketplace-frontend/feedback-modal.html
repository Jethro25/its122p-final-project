<!--
  feedback-modal.html — inline include or JS-injected feedback modal.

  Usage from JavaScript:
    openFeedbackModal({ transactionId: 5 });   // after a completed transaction
    openFeedbackModal();                        // general site feedback

  Requires: session token in sessionStorage('librowseSessionToken')
  Inject once per page by appending to <body>, then call openFeedbackModal().
-->
<div id="feedback-modal-overlay" style="
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
    z-index:9999;justify-content:center;align-items:center;">
  <div style="
      background:#fff;border-radius:16px;padding:32px;max-width:440px;width:90%;
      box-shadow:0 8px 32px rgba(0,0,0,.2);position:relative;">
    <button id="feedback-modal-close" aria-label="Close"
        style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:#777;">&times;</button>

    <h2 style="margin-top:0;font-size:20px;color:#5a3e2b;">Share Your Experience</h2>
    <p id="feedback-modal-desc" style="color:#777;font-size:14px;margin-bottom:20px;">
        How did your exchange go? Your feedback helps us improve.
    </p>

    <div id="feedback-modal-message" class="auth-message" style="display:none;margin-bottom:16px;"></div>

    <form id="feedback-modal-form">
        <!-- Star rating -->
        <div style="margin-bottom:20px;">
            <label style="display:block;font-weight:600;font-size:14px;margin-bottom:8px;color:#5a3e2b;">Rating</label>
            <div id="star-row" style="display:flex;gap:8px;" role="radiogroup" aria-label="Rating">
                <button type="button" class="star-btn" data-value="1" aria-label="1 star" title="Poor"    style="font-size:28px;background:none;border:none;cursor:pointer;line-height:1;padding:0;">☆</button>
                <button type="button" class="star-btn" data-value="2" aria-label="2 stars" title="Fair"   style="font-size:28px;background:none;border:none;cursor:pointer;line-height:1;padding:0;">☆</button>
                <button type="button" class="star-btn" data-value="3" aria-label="3 stars" title="Good"   style="font-size:28px;background:none;border:none;cursor:pointer;line-height:1;padding:0;">☆</button>
                <button type="button" class="star-btn" data-value="4" aria-label="4 stars" title="Great"  style="font-size:28px;background:none;border:none;cursor:pointer;line-height:1;padding:0;">☆</button>
                <button type="button" class="star-btn" data-value="5" aria-label="5 stars" title="Excellent" style="font-size:28px;background:none;border:none;cursor:pointer;line-height:1;padding:0;">☆</button>
            </div>
            <input type="hidden" id="feedback-rating" name="rating" value="">
        </div>

        <div class="form-group" style="margin-bottom:20px;">
            <label for="feedback-comment" style="font-weight:600;font-size:14px;color:#5a3e2b;">
                Comment <small style="font-weight:400;color:#999;">(required, max 1000 chars)</small>
            </label>
            <textarea id="feedback-comment" rows="4" maxlength="1000" required
                placeholder="What went well? What could be improved?"
                style="width:100%;margin-top:8px;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>
            <small id="feedback-char-count" style="float:right;color:#999;font-size:12px;">0 / 1000</small>
        </div>

        <button type="submit" id="feedback-modal-submit"
            style="width:100%;padding:12px;background:#8b5e3c;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;">
            <span>Submit Feedback</span>
        </button>
    </form>

    <div id="feedback-modal-success" style="display:none;text-align:center;padding:16px 0;">
        <div style="font-size:48px;margin-bottom:12px;">🌟</div>
        <h3 style="color:#27ae60;margin:0 0 8px;">Thank you!</h3>
        <p style="color:#555;font-size:14px;">Your feedback has been recorded.</p>
    </div>
  </div>
</div>

<script>
(function () {
    let currentTxId = null;

    function apiBase() {
        if (window.LIBROWSE_API_BASE) return String(window.LIBROWSE_API_BASE).replace(/\/$/, '');
        if (window.location.port === '8000') return `${window.location.protocol}//${window.location.hostname}:8000/api`;
        return '/api';
    }

    function authHeaders() {
        const token = sessionStorage.getItem('librowseSessionToken');
        return { 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) };
    }

    function showModalMsg(text, type) {
        const el = document.getElementById('feedback-modal-message');
        el.style.display = ''; el.className = 'auth-message ' + (type || 'info'); el.textContent = text;
    }

    // Star interaction
    let selectedRating = 0;
    document.querySelectorAll('.star-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            selectedRating = parseInt(this.dataset.value, 10);
            document.getElementById('feedback-rating').value = selectedRating;
            updateStars(selectedRating);
        });
        btn.addEventListener('mouseenter', function () { updateStars(parseInt(this.dataset.value, 10)); });
        btn.addEventListener('mouseleave', function () { updateStars(selectedRating); });
    });

    function updateStars(n) {
        document.querySelectorAll('.star-btn').forEach((b, i) => {
            b.textContent = i < n ? '★' : '☆';
            b.style.color  = i < n ? '#f4c542' : '#ccc';
        });
    }

    document.getElementById('feedback-comment').addEventListener('input', function () {
        document.getElementById('feedback-char-count').textContent = this.value.length + ' / 1000';
    });

    document.getElementById('feedback-modal-close').addEventListener('click', closeFeedbackModal);
    document.getElementById('feedback-modal-overlay').addEventListener('click', function (e) {
        if (e.target === this) closeFeedbackModal();
    });

    document.getElementById('feedback-modal-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const comment = document.getElementById('feedback-comment').value.trim();
        if (!comment) return showModalMsg('Please write a comment.', 'error');

        const payload = { comment };
        if (selectedRating > 0) payload.rating = selectedRating;
        if (currentTxId)        payload.transaction_id = currentTxId;

        const btn = document.getElementById('feedback-modal-submit');
        btn.disabled = true; btn.querySelector('span').textContent = 'Submitting…';
        try {
            const res  = await fetch(apiBase() + '/reports.php?action=feedback', {
                method: 'POST', headers: authHeaders(), body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (res.ok) {
                this.style.display = 'none';
                document.getElementById('feedback-modal-success').style.display = '';
                setTimeout(closeFeedbackModal, 2500);
            } else {
                showModalMsg(data.error || 'Submission failed.', 'error');
            }
        } catch {
            showModalMsg('Could not connect. Please try again.', 'error');
        } finally {
            btn.disabled = false; btn.querySelector('span').textContent = 'Submit Feedback';
        }
    });

    function closeFeedbackModal() {
        document.getElementById('feedback-modal-overlay').style.display = 'none';
        // Reset
        document.getElementById('feedback-modal-form').style.display = '';
        document.getElementById('feedback-modal-success').style.display = 'none';
        document.getElementById('feedback-modal-message').style.display = 'none';
        document.getElementById('feedback-comment').value = '';
        document.getElementById('feedback-char-count').textContent = '0 / 1000';
        document.getElementById('feedback-rating').value = '';
        selectedRating = 0;
        updateStars(0);
        currentTxId = null;
    }

    // Public API
    window.openFeedbackModal = function (opts) {
        opts = opts || {};
        currentTxId = opts.transactionId || null;
        const desc = document.getElementById('feedback-modal-desc');
        if (currentTxId) {
            desc.textContent = `How did order #${currentTxId} go? Your feedback helps our community.`;
        } else {
            desc.textContent = 'How are we doing? Your feedback helps us improve Librowse.';
        }
        document.getElementById('feedback-modal-overlay').style.display = 'flex';
    };
})();
</script>
